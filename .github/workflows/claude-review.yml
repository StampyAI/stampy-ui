# Claude reviews PRs following .claude/review-guide.md.
# - Non-draft PRs get a review comment when opened, reopened or marked ready. Later pushes
#   don't (cost); comment "/claude-review" for a new one. The action only runs on PRs whose
#   author has write access; fork PRs are refused.
# - "/claude-review" in a PR comment re-runs the review.
# - "/claude-approve" also approves the PR if the review finds nothing Medium or higher.
#   The approval is made by this workflow (github-actions[bot]), not by Claude.
# Keep this name: the Anthropic federation rule only accepts tokens from a workflow named "Claude review".
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/claude-review') ||
        startsWith(github.event.comment.body, '/claude-approve')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      APPROVE: ${{ github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/claude-approve') }}
    steps:
      # Comment events don't say where the branch is. Stop before checkout and `npm ci`,
      # which would run a fork's code with this job's write token.
      - name: Refuse fork PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" != false ]; then
            echo "::error::PR #$PR is from a fork; fork PRs are not reviewed."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ env.PR }}/head
          fetch-depth: 0

      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      # So the reviewer can run tests and probes (same setup as pr-check.yml, without its secrets)
      - run: |
          npm ci
          cp wrangler.toml.template wrangler.toml

      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          # Workload identity federation: identifiers, not secrets. Billed to Murphant's
          # Anthropic org (workspace stampy-review) until Stampy takes over.
          anthropic_federation_rule_id: fdrl_01FYV7TBGLsiEF2r8dCNsvJd
          anthropic_organization_id: 45fe0ae0-2721-4132-a627-875f33c288a7
          anthropic_service_account_id: svac_01Rkt8HbfQoXrtARvFShLBAb
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR }}
            COMMIT UNDER REVIEW: ${{ steps.sha.outputs.sha }} (checked out in the working directory)

            Review this pull request. Read .claude/review-guide.md first and follow it.
            Then read the diff (`gh pr diff ${{ env.PR }}`) and draft your Part 2 notes before
            reading the PR description and comments (`gh pr view ${{ env.PR }} --comments`).
            Dependencies are installed: run `npx jest <path>` for single tests, or `npm run test`
            (builds first, slow) for the full suite.
            Post the review as one PR comment with `gh pr comment ${{ env.PR }} --body-file <file>`.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npx jest:*),Bash(npm run test),Bash(npx tsc:*)"
            --json-schema '{"type":"object","properties":{"max_severity":{"type":"string","enum":["none","low","medium","high"],"description":"Severity of the worst finding in the posted review"}},"required":["max_severity"]}'

      # The action can skip itself and still succeed (e.g. workflow validation), which would
      # read as "no findings". Fail unless this run posted a comment naming the reviewed commit.
      - name: Check the review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          START: ${{ steps.sha.outputs.start }}
        run: |
          if ! gh pr view "$PR" --json comments \
              --jq ".comments[] | select(.createdAt >= \"$START\") | .body" | grep -qF "$SHA"; then
            echo "::error::No review comment for $SHA was posted by this run."
            exit 1
          fi

      - name: Approve
        if: >
          env.APPROVE == 'true' &&
          steps.review.outputs.structured_output != '' &&
          contains(fromJSON('["none","low"]'), fromJSON(steps.review.outputs.structured_output).max_severity)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" != "$SHA" ]; then
            echo "PR head moved since the review; not approving."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            -f event=APPROVE \
            -f commit_id="$SHA" \
            -f body="Approved on request: Claude's review of this commit found nothing Medium or higher. See the review comment above."
